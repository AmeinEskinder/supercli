# Sidecar for the `unpeelstore` worker area.
# Owned by the unpeelstore worker. Other workers: do not edit this file.
# See docs/parity/swift-port/README.md for the workflow and the strict
# "ported" standard.
#
# UnpeelStore.swift (the ~17k-line macOS store) was previously keyed TWICE
# inside macos-services.yml; the duplicate key meant PyYAML silently kept
# only the second entry and the store_policies behaviours vanished from the
# generated map. Both entries are merged here as the single owner.
area: unpeelstore
files:
  native/SupercliNative/Sources/SupercliNative/UnpeelStore.swift:
    destination: "Rust: supercli-core + supercli-client"
    status: partial
    checklist: ""
    behaviours:
      - swift: "phoneResizeOverrides(fromHostPublished:locallyCleared:) — running + both dims, clamp 2...300 x 2...120, cleared ids stay cleared"
        target: "crates/supercli-core/src/store_policies.rs::phone_resize_overrides"
        test: "store_policies::tests::phone_fit_only_running_sessions_with_both_dimensions, phone_fit_clamps_dimensions, phone_fit_locally_cleared_ids_stay_cleared"
      - swift: "predictedResumeInsertionIndex — unranked newest-first, unranked precede ranked, shared-order ranks, below folders when no running rows"
        target: "crates/supercli-core/src/store_policies.rs::predicted_resume_insertion_index"
        test: "store_policies::tests::unranked_row_sorts_newest_first_among_running_rows, ranked_row_takes_its_shared_rank_after_unranked_rows, unranked_source_precedes_every_ranked_row, no_running_rows_leads_the_stopped_rows_below_folders"
      - swift: "supersededRestartGhostIDs — dead row is ghost iff live row shares nonzero (project_id, created_at)"
        target: "crates/supercli-core/src/store_policies.rs::superseded_restart_ghost_ids"
        test: "store_policies::tests::restart_ghost_needs_live_row_with_same_project_and_created_at, restart_ghost_never_removes_live_rows, restart_ghost_multiple_dead_generations_share_one_live_replacement"
      - swift: "resolvedSessionTitle — durable freshness: pending write newer than shared marker wins, legacy timestamp-less defers to valid marker"
        target: "crates/supercli-core/src/store_policies.rs::resolved_session_title"
        test: "store_policies::tests::title_resolution_uses_durable_freshness, legacy_pending_title_never_overwrites_a_valid_shared_marker, pending_or_legacy_native_title_publishes_when_no_valid_marker_exists"
      - swift: "decodedPendingTitleWrites — conservative: JSON map, plist dict with u64 values, legacy [String] to zero timestamps"
        target: "crates/supercli-core/src/store_policies.rs::decoded_pending_title_writes"
        test: "store_policies::tests::legacy_pending_title_storage_decodes_conservatively"
      - swift: "applyPinOverrides — raw-JSON edits preserving unknown fields, legacy flat normalization, malformed shape refuses"
        target: "crates/supercli-core/src/store_policies.rs::apply_pin_overrides"
        test: "store_policies::tests::pin_intent_preserves_concurrent_unrelated_shared_pin, pin_removal_touches_only_its_own_key, pin_intent_keeps_legacy_flat_pins_and_normalizes_shape, malformed_pin_state_leaves_intent_pending"
      - swift: "reconciledPinOverrides — timestamp-based add/remove reconciliation against shared state"
        target: "crates/supercli-core/src/store_policies.rs::reconciled_pin_overrides"
        test: "store_policies::tests::newer_shared_unpin_retires_stale_native_added_overlay, pending_native_add_survives_an_older_shared_snapshot, newer_shared_repin_retires_native_removal, pending_native_removal_beats_an_older_shared_pin, legacy_untimestamped_removal_defers_to_readable_shared_state"
      - swift: "settings_resolve — auto_stop_archive_minutes normalization/resolution/labels (absent vs explicit vs junk)"
        target: "crates/supercli-core/src/settings_resolve.rs::normalize_auto_stop_archive_minutes, resolve_auto_stop_archive_minutes"
        test: "settings_resolve::tests (10 tests)"
      - swift: "settings_resolve — sidebar_stopped_limit normalization/resolution/labels (absent vs explicit vs junk)"
        target: "crates/supercli-core/src/settings_resolve.rs::normalize_sidebar_stopped_limit, resolve_sidebar_stopped_limit"
        test: "settings_resolve::tests (10 tests)"
      - swift: "approval_pairs — caller->targets approval map discipline (approve/revoke/prune/carry) for MCP write, MCP app-open, computer, browser approvals"
        target: "crates/supercli-core/src/approval_pairs.rs::ApprovalPairs"
        test: "approval_pairs::tests (8 tests)"
      - swift: "preset_overlay — legacy preset overlay application (removed/edited/added)"
        target: "crates/supercli-core/src/preset_overlay.rs"
        test: "preset_overlay::tests (5 tests)"
      - swift: "host_routing — Host-scope projection display and verb routing predicates"
        target: "crates/supercli-client/src/host_routing.rs"
        test: "host_routing::tests (5 tests)"
      - swift: "RemoteArchivedSessionSummaryCache — per-project archived session summary cache (replaceProject drops stale rows, retainProjects prunes, removeAll clears)"
        target: "crates/supercli-client/src/remote_session_cache.rs::RemoteArchivedSessionSummaryCache"
        test: "remote_session_cache::tests (8 tests)"
    tests:
      - file: crates/supercli-core/src/store_policies.rs
        count: 23
      - file: crates/supercli-core/src/settings_resolve.rs
        count: 10
      - file: crates/supercli-core/src/approval_pairs.rs
        count: 8
      - file: crates/supercli-core/src/preset_overlay.rs
        count: 5
      - file: crates/supercli-client/src/host_routing.rs
        count: 5
      - file: crates/supercli-client/src/remote_session_cache.rs
        count: 8
    notes: "Merged from two duplicate macos-services.yml entries (the duplicate YAML key silently dropped the store_policies half). 6 pure-logic sections ported with 59 tests: store_policies (23), settings resolution (10), approval pairs (8), preset overlay (5), host routing (5), remote session cache (8). The remaining ~16,500 lines (SwiftUI state, AppKit UI, NSOpenPanel, UserDefaults persistence, session management) are not portable to Rust and remain with UI workers. The Swift pluginActivation check already exists in Rust as plugins::active()."
