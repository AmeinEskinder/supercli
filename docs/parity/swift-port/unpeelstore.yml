        target: "crates/supercli-client/src/sidebar_order.rs::SidebarOrderState::rebuild_pin_groups, assemble_pinned_items, advertised_session_order, apply_pinned_record_order"
        test: "sidebar_order::tests::rebuild_pin_groups_validity_ordering_and_overlay, rebuild_pin_groups_unplaced_append_oldest_first, assemble_pinned_items_mixed_order_with_preview_rerank, advertised_session_order_only_when_interleaving_folders, apply_pinned_record_order_reorders_and_keeps_rest, apply_pinned_record_order_synthesizes_group_records, apply_pinned_record_order_legacy_flat_and_unknown_shapes"
