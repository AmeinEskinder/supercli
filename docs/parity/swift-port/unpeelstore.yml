      - file: crates/supercli-core/src/store_policies.rs
        count: 14
      - file: crates/supercli-core/src/settings_resolve.rs
        count: 10
      - file: crates/supercli-core/src/approval_pairs.rs
        count: 8
      - file: crates/supercli-core/src/preset_overlay.rs
        count: 5
      - file: crates/supercli-client/src/host_routing.rs
        count: 5
      - file: crates/supercli-client/src/remote_session_cache.rs
        count: 8
      - file: crates/supercli-client/src/sidebar_order.rs
        count: 43
    notes: "Merged from two duplicate macos-services.yml entries (the duplicate YAML key silently dropped the store_policies half). 7 pure-logic sections ported with 93 tests: store_policies (14), settings resolution (10), approval pairs (8), preset overlay (5), host routing (5), remote session cache (8), sidebar ordering (43). The pin-override kernel (applyPinOverrides/reconciledPinOverrides + 9 tests, formerly supercli-core::store_policies) now lives in supercli-client::sidebar_order as the single pin/sidebar kernel — the Host never called it (verified zero callers on next) and the client cannot depend on core; the Host's persisted pin model (supercli-core::state::PinnedSidebarSession) is unchanged. The sidebar ordering port covers the ordering kernel only: tree build, overlay precedence/application, sibling reorder math, session sorts, drag preview/commit/cancel state, local overlay writes, pin-group rebuild, pinned-item assembly, advertised order, and the raw-JSON pinned-record reorder. UserDefaults/app-state/shared-file persistence, remote-Host verb paths, SwiftUI animations, the sidebarLists truncation window, archive sections, and pane-layout reconciliation are not portable and stay with UI/host workers. The remaining ~16,500 lines (SwiftUI state, AppKit UI, NSOpenPanel, session management) are not portable to Rust and remain with UI workers. The Swift pluginActivation check already exists in Rust as plugins::active(). The sidebar row types are local web-safe views (supercli-client has no supercli-core dependency); SessionStatus reuses remote_dto_adapters::SessionStatus."
