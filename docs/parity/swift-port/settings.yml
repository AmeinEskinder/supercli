    dedup: "2026-09-27: DUPLICATE with feat/swift-settings@7b7e7c0. That branch wired SettingsController, the overlay, and the agents tab from the same 32abb60 base. KEEP from this branch: SettingsLocalStore ($SUPERCLI_HOME/desktop/settings.json, theme + desktop-only fields local-only, never sent to Host) \u2014 swift-settings has no local store. KEEP from swift-settings: the SettingsController/overlay/agents-tab wiring as the canonical mount (it is the queued/canonical candidate; as of 2026-09-27 next is at 32abb60 and neither branch has landed). The integrator must merge ONE settings wiring: take swift-settings as the base and cherry-pick this branch's SettingsLocalStore + local-only theme semantics + palette reachability + gpuidart-gaps-keys.md. Do NOT ship both overlays."
