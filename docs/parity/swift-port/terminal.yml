    notes: "PARTIAL 2026-09-29: Ghostty-free value types ported to supercli-core::ghostty_bridge (controller-core gated, no GUI deps): RemoteTerminalViewport, RemoteTerminalCallbackEpoch, RemoteTerminalCallbackRelay, RemoteTerminalLocalFeed, GhosttyTerminalPaneDelegate trait. Swift's MainActor delivery hop is collapsed to a synchronous epoch check; the stale-callback-discard invariant is preserved and tested. The ~2000 LOC of AppKit NSView classes (GhosttyTerminalPane, RemoteGhosttyTerminalPane, PathDraggableTerminalView) do NOT stay Swift-side: under the 0% goal they are rewritten as TerminalPaneView on gpuidart (rendering via UiTerminal, input via raw key stream, drops via the semantic drop-target map). Rewrite gaps documented in docs/gpuidart-gaps-terminal.md (G-12 drag-out, G-13 visibility signals, G-14 cursor-shape/hover); P0-8 gaps G-5/G-7/G-8 (raw keys, resize, mouse) also required."

