    status: ported
    notes: "VisualEffectBackground/WindowDragArea are NSViewRepresentable; SidebarBackground/FrameBackdrop/ContentBackground/SurfaceBackdrop are SwiftUI vibrancy/material views. No Dart equivalent; gpuidart draws chrome natively. TitleBarView's 38px titlebar concept is covered by the RootView titlebar port."

  native/SupercliNative/Sources/SupercliNative/TerminalPaneWindow.swift:
