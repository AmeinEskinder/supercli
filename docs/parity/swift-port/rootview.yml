# Sidecar for the `rootview` worker area (RootView shell + window chrome).
# Owned by the rootview porter. Other workers: do not edit this file.
# See docs/parity/swift-port/README.md for the workflow and the strict
# "ported" standard.
#
# Audit status (2026-09-30): The held feat/port-rootview branch was audited.
# - PaneLayoutState.swift Dart port (lib/pane_layout_state.dart) DROPPED:
#   superseded by the Rust port (supercli-client::pane_layout + FFI, merged).
# - RootView.swift: 22 behaviours mapped to Dart + 43 tests written.
#   Status is `partial` (not `ported`): tests are written but NOT yet executed
#   (no Dart SDK in this VM); CI must run them green before 'ported'.
# - Theme duplicates removed: rootview_logic.dart now uses ThemeLayout.*
#   and spinnerFrames/spinnerInterval from lib/theme.dart (PORTER_DUTY fix).
# - Chrome.swift, TerminalPaneWindow.swift: dropped (AppKit-only rendering).
area: rootview
files:
  native/SupercliNative/Sources/SupercliNative/Views/RootView.swift:
    destination: "Dart: clients/supercli-app"
    status: partial
    checklist: ""
