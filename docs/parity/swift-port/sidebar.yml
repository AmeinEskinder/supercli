  native/SupercliNative/Sources/SupercliNative/WorkspacePool.swift:
    destination: "Rust: supercli-client::workspace_pool"
    status: ported
    checklist: ""
    behaviours:
      - swift: "Background read-only polling and snapshot cache; equivalent (timestamp-only) snapshots never republish (acceptSnapshot, isEquivalent(to:))"
        target: "crates/supercli-client/src/workspace_pool.rs::PooledSnapshot"
        test: "crates/supercli-client/src/workspace_pool.rs::snapshot_equivalence_ignores_capture_timestamp"
      - swift: "Exponential backoff for unreachable hosts: base doubling, exponent clamp 16, cap 300ms (backoffDelayNanoseconds)"
        target: "crates/supercli-client/src/workspace_pool.rs::backoff_delay_ms"
        test: "crates/supercli-client/src/workspace_pool.rs::backoff_doubles_and_caps"
      - swift: "Remote concurrency cap with FIFO waiter queue; failing hosts release their slot during backoff (acquireRemoteSlot/releaseRemoteSlot/grantNextSlot)"
        target: "crates/supercli-client/src/workspace_pool.rs::RemoteSlotPool"
        test: "crates/supercli-client/src/workspace_pool.rs::slot_pool_grants_fifo_and_drops_stale_waiters"
      - swift: "Attention badge plus once-per-blocked-edge notification latch; silent initial seeding; foreground suppression"
        target: "crates/supercli-client/src/workspace_pool.rs::AttentionLatch + advance_attention"
        test: "crates/supercli-client/src/workspace_pool.rs::attention_latch_seeds_silently_then_notifies_on_edge"
      - swift: "Target reconciliation: fingerprint change retires/reopens, runtime-excluded keys retire but keep cache, forgotten keys drop cache (refreshTargets)"
        target: "crates/supercli-client/src/workspace_pool.rs::reconcile_pool_targets"
        test: "crates/supercli-client/src/workspace_pool.rs::reconcile_retires_vanished_and_fingerprint_changed"
      - swift: "Identity mismatch fails closed and latches the fingerprint until the record changes"
        target: "crates/supercli-client/src/workspace_pool.rs::reconcile_pool_targets"
        test: "crates/supercli-client/src/workspace_pool.rs::identity_mismatch_fails_closed"
      - swift: "Optimistic project/session reorder holds pinned over stale bootstraps, released by host confirmation or the 15s timeout (applyingOrganizationHolds, holdProjectOrder, holdSessionOrder)"
        target: "crates/supercli-client/src/workspace_pool.rs::OrganizationHolds"
        test: "crates/supercli-client/src/workspace_pool.rs::relative_order_replaces_only_named_positions"
      - swift: "runEntryLoop as a host-driven state machine: AcquireSlot -> Connect -> Bootstrap -> PollSleep/BackoffSleep; remote slot reacquired after backoff (PoolEntryDriver/PoolLoopAction)"
        target: "crates/supercli-client/src/workspace_pool.rs::PoolEntryDriver"
        test: "crates/supercli-client/src/workspace_pool.rs::driver_remote_happy_path_poll_loop"
      - swift: "Interruptible entry sleep with sticky wake (entry.wake/resumeWake); immediate-refresh throttle"
        target: "crates/supercli-client/src/workspace_pool.rs::WakeSignal"
        test: "crates/supercli-client/src/workspace_pool.rs::wake_signal_is_sticky_and_consumed_once"
      - swift: "Slot release grants the next waiter; failing hosts free their slot during backoff so one dead host never starves a live one"
        target: "crates/supercli-client/src/workspace_pool.rs::DriverStepOutcome"
        test: "crates/supercli-client/src/workspace_pool.rs::driver_connect_failure_releases_slot_and_backs_off"
      - swift: "Identity mismatch in the loop releases the slot and closes the backend exactly once (retireEntry path)"
        target: "crates/supercli-client/src/workspace_pool.rs::PoolEntryDriver::on_bootstrap"
        test: "crates/supercli-client/src/workspace_pool.rs::driver_identity_mismatch_fails_closed"
      - swift: "PooledBackend.claimClose — close-once guard, re-armed per reconnect"
        target: "crates/supercli-client/src/workspace_pool.rs::PoolEntryDriver::claim_close"
        test: "crates/supercli-client/src/workspace_pool.rs::driver_close_guard_rearms_on_reconnect"
      - swift: "AttentionNotifier hook: attention notifications with titles"
        target: "crates/supercli-client/src/workspace_pool.rs::attention_notifications"
        test: "crates/supercli-client/src/workspace_pool.rs::attention_notifications_carry_titles_and_dedupe_order"
    tests:
      - file: crates/supercli-client/src/workspace_pool.rs
        count: 34
    notes: "Logic moved to Rust per Amein's one-implementation rule (feat/move-dart-logic-to-rust, next@5dc280a). Dart workspace_pool.dart deleted; FFI exposes via supercli-client-ffi. The async entry loop is ported as a host-driven state machine (WakeSignal + PoolEntryDriver + PoolLoopAction + DriverStepOutcome): the host owns the async runtime, executes the returned actions, and feeds results back. @Published publishing, UNUserNotificationCenter delivery and MainActor orchestration are platform runtime machinery with no portable equivalent — not ported."

