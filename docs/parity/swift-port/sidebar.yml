  native/SupercliNative/Sources/SupercliNative/Views/SidebarView.swift:
    destination: 'Dart: clients/supercli-app'
    status: partial
    checklist: '#151'
    behaviours:
    - Sidebar mounted in SupercliApp.build() (app.dart), fed by live Host bootstrap
      sessions
    - SessionSummary decodes real Host wire format (updatedAtUnixMs, unread bool,
      projectID, status, activity, pinned)
    - 'SidebarSession.fromHostSummary: attention from activity=blocked, busy from
      activity=working/starting, pinned + projectId from Host'
    - Project tree uses real Host project names from bootstrap projects array
    - Selection wired via app.selectedSessionId; verified headless against live Host
      (2 real sessions)
    - swift: 'SidebarBranchLabel: branch shown in monospaced 10pt, hidden when branch
        == projectName'
      target: lib/screens/sidebarview.dart::SidebarBranchLabel
      test: test/sidebar_completion_test.dart::SidebarBranchLabel group
    - swift: 'ActiveProjectBranchLabel: label only for the project holding the selected
        session; hidden for worktrees'
      target: lib/screens/sidebarview.dart::ActiveProjectBranchLabel
      test: test/sidebar_completion_test.dart::ActiveProjectBranchLabel group
    - swift: 'SidebarFooter: settings + add-project + collapse-all; collapse-all disabled
        while nothing expanded; add-project hidden while remote Host scoped'
      target: lib/screens/sidebarview.dart::SidebarFooter
      test: test/sidebar_completion_test.dart::SidebarFooter group
    - swift: 'ArchiveActionButton/RemoveActionButton: archive for resumable sessions,
        remove for non-resumable'
      target: lib/screens/sidebarview.dart::RowActionButtons
      test: test/sidebar_completion_test.dart::RowActionButtons group
    tests:
    - file: clients/supercli-app/test/sidebar_test.dart
      count: 36
    - file: clients/supercli-app/test/sidebar_completion_test.dart
      count: 9
    notes: 'Partial 2026-09-27 (feat/wire-sidebar): Host wiring done for session list,
      status signals and project tree (headless e2e against live Host, 2 real sessions).
      2026-09-29 (feat/port-sidebar-terminal): branch labels, footer, row action buttons
      ported with tests. SidebarView.swift is 4,406 lines / ~151 funcs; remaining
      behaviours (drag highlight rendering, motion/transitions, scroll targets, fade
      masks, preset strip, context menus beyond #153/#154) still todo. Screenshot
      BLOCKED: gpuidart window does not materialize on bare Xvfb (no WM); not verified.'
  native/SupercliNative/Sources/SupercliNative/Views/SidebarSessionDrag.swift:
    destination: 'Dart: clients/supercli-app'
    status: ported
    checklist: '#152'
    behaviours:
    - swift: 'Detached drag state machine: targets reorder/group/project/split, canDrop
        validation'
      target: lib/screens/projectsidebarview.dart::SidebarSessionDrag
      test: test/sidebar_test.dart::SidebarSessionDrag (#152)
    - swift: Drop commit composes moveSession + setSessionOrder through the Host
      target: lib/screens/projectsidebarview.dart::SidebarSessionDrag.commitDrop
      test: test/sidebar_test.dart::SidebarSessionDrag commit (live Host verbs)
    - swift: Reorder commits one session-order verb with the recomputed hand order
      target: lib/host_client.dart::HostClient.setSessionOrder
      test: test/host_client_test.dart::setSessionOrder posts projectID + orderedSessionIDs
    - swift: Cross-project drop files the session via session-organization, then places
        it
      target: lib/host_client.dart::HostClient.moveSessionToProject
      test: test/host_client_test.dart::moveSessionToProject posts sessionID + projectID
    - swift: Drag overlay mounted in the app shell; commit/cancel dispatched to the
        Host
      target: lib/app.dart::SupercliApp.sessionDrag + bin/main.dart::_dispatchAction
      test: test/app_test.dart::beginSessionDrag mounts the overlay and records context
    tests:
    - file: clients/supercli-app/test/sidebar_test.dart
      count: 14
    - file: clients/supercli-app/test/host_client_test.dart
      count: 4
    - file: clients/supercli-app/test/app_test.dart
      count: 4
    notes: 'Wired 2026-09-27 (feat/wire-drag): commitDrop applies validated drops
      against the LIVE Host via authenticated POST /mobile/session-order + /mobile/session-organization
      (verified against a real Host: 200 + session-order.json persisted, 400 on traversal,
      401 unauthenticated); mounted in SupercliApp.build + sidebar.drag.commit/cancel
      dispatched in bin/main.dart. NOT verified: no real-window screenshot — blocked
      by missing libxkbcommon-x11.so.0 in this VM (prebuilt libgpuidart.so cannot
      load) and by gpuidart gap G-1 (no DnD pointer events, so a drag cannot be initiated).'
