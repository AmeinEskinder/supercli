# Sidecar for the `appkit` worker area.
# Owned by the appkit worker. Other workers: do not edit this file.
# See docs/parity/swift-port/README.md for the workflow and the strict
# "ported" standard.
#
# Honest assessment 2026-09-27: 1 of 29 files meets the strict "ported" bar
# (every Swift behaviour -> Dart function + test). 15 partial, 13 todo,
# 0 tbd. UIDelta wire decode + validation ported; incremental application
# remains GAP-APPKIT-3.
area: appkit
files:
  app-kit/swift/Sources/SupercliAppKitUI/UIProtocol.swift:
    destination: "Dart: appkit_widgets"
    status: partial
    behaviours:
      - swift: "UINode JSON decode (type-discriminated UIComponent)"
        target: "lib/widgets/appkit_protocol.dart::AppKitNode.fromJson"
        test: "test/appkit_protocol_test.dart::rich list decoding usage page decodes"
      - swift: "UIComponent unknown-kind terminal fallback"
        target: "lib/widgets/appkit_protocol.dart::AppKitComponent.fromJson"
        test: "test/appkit_protocol_test.dart::unknown component decodes to unsupported"
      - swift: "UIGaugeSpec percentageLabel / valueLabel math"
        target: "lib/widgets/appkit_protocol.dart::GaugeSpec.percentageLabel"
        test: "test/appkit_protocol_test.dart::percentageLabel mirrors Swift"
      - swift: "UIGaugeSpec validation (ratio 0...1, label, accessibilityText)"
        target: "lib/widgets/appkit_protocol.dart::GaugeSpec.fromJson"
        test: "test/appkit_protocol_test.dart::invalid gauge JSON throws"
      - swift: "UIListItemSpec single-line validation"
        target: "lib/widgets/appkit_protocol.dart::ListItemSpec.fromJson"
        test: "test/appkit_protocol_test.dart::single-line validation rejects multi-line labels"
      - swift: "UnpeelUIProtocol version negotiation"
        target: "lib/widgets/appkit_protocol.dart::AppKitProtocol.negotiate"
        test: "test/appkit_protocol_test.dart::negotiate picks the shared maximum"
      - swift: "UIEvent wire envelope (kind/targetId/value)"
        target: "lib/widgets/appkit_protocol.dart::AppKitEvent.toJson"
        test: "test/appkit_protocol_test.dart::event serializes the wire envelope"
      - swift: "PageSpec/ListSpec/ContentSpec/TreeSpec/TextBoxSpec decode"
        target: "lib/widgets/appkit_protocol.dart::PageSpec.fromJson"
        test: "test/appkit_protocol_test.dart::rich list decoding"
      - swift: "requiredCapabilities negotiation"
        target: null
        test: null
      - swift: "UIMenuSpec/UIInputSpec full decode"
        target: null
        test: null
      - swift: "Sparkline/barChart/lineChart page bodies"
        target: null
        test: null
    tests:
      - file: clients/supercli-app/test/appkit_protocol_test.dart
        count: 15
    notes: "Core decode types ported (4216 Swift LOC -> ~1100 Dart LOC). Missing: capability negotiation (GAP-APPKIT-2), full menu/input/chart specs."

