# Sidecar for the `macos-services` worker area.
# Owned by the macos-services worker. Other workers: do not edit this file.
# See docs/parity/swift-port/README.md for the workflow and the strict
# "ported" standard.
#
# CLAUDE REVIEW 2026-09-27: Behaviour-level "ported" standard enforced.
# A row is "ported" only when EVERY Swift behaviour maps to a Rust function
# PLUS a test. Rows below use "partial" where the audit is incomplete.
