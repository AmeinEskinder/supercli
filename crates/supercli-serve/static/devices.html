<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>supercli — Devices</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; }
  header { padding: 12px 20px; border-bottom: 1px solid #21262d; display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  header nav a { color: #58a6ff; text-decoration: none; margin-right: 12px; }
  #layout { display: flex; height: calc(100vh - 53px); }
  #device-list { width: 260px; border-right: 1px solid #21262d; overflow-y: auto; padding: 8px; }
  .device-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  .device-item:hover { background: #161b22; }
  .device-item.active { background: #1c2b3a; outline: 1px solid #58a6ff; }
  .device-item .id { font-weight: 600; }
  .device-item .meta { font-size: 12px; color: #8b949e; }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #viewer-row { flex: 1; display: flex; min-height: 0; }
  #screen-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #010409; position: relative; }
  .device-frame { border: 10px solid #21262d; border-radius: 36px; overflow: hidden; max-height: 100%; max-width: 100%; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  .device-frame canvas { display: block; max-height: calc(100vh - 220px); max-width: 100%; cursor: crosshair; }
  #toolbar { padding: 8px; display: flex; gap: 8px; justify-content: center; border-top: 1px solid #21262d; }
  button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #30363d; }
  #side { width: 340px; border-left: 1px solid #21262d; display: flex; flex-direction: column; }
  #tabs { display: flex; border-bottom: 1px solid #21262d; }
  #tabs button { flex: 1; border: none; border-radius: 0; background: none; padding: 10px; }
  #tabs button.active { border-bottom: 2px solid #58a6ff; color: #58a6ff; }
  .tabpane { flex: 1; overflow: auto; padding: 8px; display: none; font-family: ui-monospace, monospace; font-size: 12px; }
  .tabpane.active { display: block; }
  #logs { white-space: pre-wrap; }
  #a11y { white-space: pre; }
  #status { padding: 6px 20px; font-size: 12px; color: #8b949e; border-top: 1px solid #21262d; }
  #typebar { display: flex; gap: 8px; padding: 8px; border-top: 1px solid #21262d; }
  #typebar input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: 6px 10px; }
</style>
</head>
<body>
<header>
  <h1>Devices</h1>
  <nav><a href="/farm">/farm wall</a></nav>
  <span id="conn-status"></span>
</header>
<div id="layout">
  <div id="device-list"></div>
  <div id="main">
    <div id="viewer-row">
      <div id="screen-wrap">
        <div class="device-frame"><canvas id="screen"></canvas></div>
      </div>
      <div id="side">
        <div id="tabs">
          <button data-tab="logs" class="active">Logs</button>
          <button data-tab="a11y">A11y tree</button>
        </div>
        <div id="logs" class="tabpane active"></div>
        <div id="a11y" class="tabpane">Select a device to load its accessibility tree.</div>
      </div>
    </div>
    <div id="toolbar">
      <button data-key="home">Home</button>
      <button data-key="back">Back</button>
      <button data-key="power">Power</button>
      <button data-key="lock">Lock</button>
      <button id="refresh-a11y">Refresh a11y</button>
      <span id="fps" style="align-self:center;color:#8b949e;font-size:12px;"></span>
    </div>
    <div id="typebar">
      <input id="type-input" placeholder="Type text into the focused field…" aria-label="Type text">
      <button id="type-send">Send</button>
    </div>
  </div>
</div>
<div id="status">Not connected.</div>
<script src="/static/device-stream.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const status = (t) => { $("status").textContent = t; };
  let currentId = null;
  let stream = null;
  let logs = null;

  // Tabs
  document.querySelectorAll("#tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#tabs button").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".tabpane").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      $(btn.dataset.tab).classList.add("active");
    });
  });

  async function loadDevices() {
    const res = await fetch("/api/devices");
    const data = await res.json();
    const list = $("device-list");
    list.innerHTML = "";
    (data.devices || []).forEach((d) => {
      const el = document.createElement("div");
      el.className = "device-item" + (d.id === currentId ? " active" : "");
      el.innerHTML = '<div class="id"></div><div class="meta"></div>';
      el.querySelector(".id").textContent = d.name || d.id;
      el.querySelector(".meta").textContent = d.platform + " · " + d.state + " · " + (d.connection_type || "?") + " · " + d.id;
      el.addEventListener("click", () => selectDevice(d.id));
      list.appendChild(el);
    });
    if (!currentId && data.devices && data.devices.length > 0) {
      selectDevice(data.devices[0].id);
    }
    if (!data.devices || data.devices.length === 0) {
      status("No devices connected. Boot one with: supercli device boot <avd|udid>");
    }
  }

  function selectDevice(id) {
    if (stream) stream.stop();
    if (logs) logs.stop();
    currentId = id;
    document.querySelectorAll(".device-item").forEach((el) => el.classList.remove("active"));
    loadDevicesList(); // re-mark active without reselecting
    $("logs").textContent = "";
    $("a11y").textContent = "Loading…";
    status("Connecting to " + id + "…");

    stream = new DeviceStream.DeviceStream({
      deviceId: id,
      canvas: $("screen"),
      onDescription: (meta) => {
        stream.configureDecoder(meta);
        status("Streaming " + id + (meta.width ? " (" + meta.width + "×" + meta.height + "@" + (meta.fps || "?") + "fps)" : ""));
      },
      onError: (err) => status("Stream error: " + (err && err.message)),
      onClose: () => status("Stream closed."),
    });
    stream.onFps = (fps) => { $("fps").textContent = fps + " fps"; };
    stream.start();

    logs = new DeviceStream.LogStream({
      deviceId: id,
      onLine: (line) => {
        const el = $("logs");
        el.textContent += line + "\n";
        const lines = el.textContent.split("\n");
        if (lines.length > 500) el.textContent = lines.slice(-500).join("\n");
        el.scrollTop = el.scrollHeight;
      },
    });
    logs.start();
    refreshA11y();
  }

  // loadDevices without auto-select (called on re-render)
  async function loadDevicesList() {
    const res = await fetch("/api/devices");
    const data = await res.json();
    const list = $("device-list");
    list.innerHTML = "";
    (data.devices || []).forEach((d) => {
      const el = document.createElement("div");
      el.className = "device-item" + (d.id === currentId ? " active" : "");
      el.innerHTML = '<div class="id"></div><div class="meta"></div>';
      el.querySelector(".id").textContent = d.name || d.id;
      el.querySelector(".meta").textContent = d.platform + " · " + d.state + " · " + (d.connection_type || "?") + " · " + d.id;
      el.addEventListener("click", () => selectDevice(d.id));
      list.appendChild(el);
    });
  }

  async function refreshA11y() {
    if (!currentId) return;
    try {
      const res = await fetch("/api/devices/" + encodeURIComponent(currentId) + "/a11y");
      const data = await res.json();
      $("a11y").textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      $("a11y").textContent = "a11y fetch failed: " + err.message;
    }
  }

  document.querySelectorAll("#toolbar [data-key]").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (stream) stream.sendKey(btn.dataset.key);
    });
  });
  $("refresh-a11y").addEventListener("click", refreshA11y);
  function sendType() {
    const v = $("type-input").value;
    if (v && stream) {
      stream.sendText(v);
      $("type-input").value = "";
    }
  }
  $("type-send").addEventListener("click", sendType);
  $("type-input").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") sendType();
  });

  loadDevices();
  setInterval(loadDevicesList, 10000); // refresh list, keep selection
})();
</script>
</body>
</html>
