# cargo-deny configuration for the `crates/` Rust workspace.
# Run: `cargo deny --manifest-path crates/Cargo.toml check`
# Every exception below carries a reason; nothing is allow-listed silently.

[graph]
# The full resolve, all targets: a banned crate on any target is banned.
all-features = false

[licenses]
# Supercli itself is MIT. Dependencies must be under a permissive license the
# project can redistribute; copyleft licenses are rejected.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "OpenSSL",
  # MPL-2.0 (option-ext 0.2.0, via dirs): file-level copyleft, not viral.
  # The crate is a tiny path helper; we do not modify it, so the copyleft
  # obligations do not propagate to Supercli.
  "MPL-2.0",
  # CDLA-Permissive-2.0 (webpki-roots): permissive data license covering the
  # Mozilla CA certificate bundle. No code copyleft.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Copies left in the tree fail the check instead of being silently ignored.
unused-license-exception = "deny"

# --- Exceptions (each with a reason) ---------------------------------------
# (populated by `cargo deny check licenses`; see docs/security for review)

[bans]
# Two versions of the same crate in one resolve: deny by default, allow only
# the duplicates below, each with a reason.
multiple-versions = "deny"
# No wildcard dependency requirements anywhere in the workspace.
wildcards = "deny"
# No git or path-only crates sneaking past crates.io review.
highlight = "all"

# --- Exceptions (each with a reason) ---------------------------------------
# Duplicate versions below are different MAJOR versions required by
# different dependencies; unifying them would require breaking upgrades of
# third-party crates and is out of scope. Each is a standard ecosystem
# split (e.g. syn 1.x vs 2.x during migration).

# --- Exceptions (each with a reason) ---------------------------------------
# Duplicate versions below are different MAJOR versions required by
# different dependencies; unifying them would require breaking upgrades of
# third-party crates and is out of scope. Each is a standard ecosystem
# split (e.g. syn 2.x vs 3.x during migration).
#
# Every skip entry pins EXACT versions (version = "=x.y.z", one entry per
# version in Cargo.lock). cargo-deny matches skips per (name, version), so
# an unpinned entry would silently allow any future duplicate version.
# When Cargo.lock gains a new duplicate version, add a new pinned entry
# here with a reason -- do not broaden an existing pin.
#
# Queue #16 note (2026-09-29): the wire-remote-runtime merge enabled keyring's
# `async-secret-service` feature, pulling in secret-service v4 + the zbus v4
# D-Bus stack. That stack legitimately requires different major versions of
# crates the rest of the workspace pins differently (classic ecosystem split,
# same class as the skips above). Unifying would require breaking upgrades of
# third-party crates (portable-pty's nix 0.25 pin, keyring's
# security-framework 2.x requirement, zbus's nix 0.29 requirement) and is out
# of scope. cargo-deny does not cascade skips to a crate's dependencies, so
# each duplicated platform sub-crate needs its own entry.

