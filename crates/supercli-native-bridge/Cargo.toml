[package]
name = "supercli-native-bridge"
description = "Panic-contained C ABI for the native Supercli app to call supercli-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
supercli-core = { version = "0.9.0", path = "../supercli-core" }
# Reuse supercli-connector's keychain — do not duplicate it here.
supercli-connector = { version = "0.9.0", path = "../supercli-connector" }
# CredentialStore / KeyringStore come from supercli-client (re-exported
# through the connector's keychain module).
supercli-client = { version = "0.9.0", path = "../supercli-client" }

# objc2 platform bindings — Apple targets only. Linux/other builds get stub
# implementations in src/platform/ that compile without these crates.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
objc2-speech = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = "0.3"

[dev-dependencies]
supercli-serve = { version = "0.9.0", path = "../supercli-serve" }
