[package]
name = "supercli-client-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C ABI for the Supercli client logic — the single Rust implementation the Dart/gpuidart UI calls into (Amein's rule: one implementation, in Rust)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
supercli-core = { version = "0.9.0", path = "../supercli-core" }
supercli-client = { version = "0.9.0", path = "../supercli-client" }
serde_json = "1"
