[package]
name = "supercli-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The supercli CLI: the UI-free Host service (`supercli serve`) and scriptable verbs over Supercli sessions"

[[bin]]
name = "supercli"
path = "src/main.rs"

[dependencies]
supercli-core = { version = "0.9.0", path = "../supercli-core" }
supercli-serve = { version = "0.9.0", path = "../supercli-serve" }
supercli-connector = { version = "0.9.0", path = "../supercli-connector" }
supercli-client = { version = "0.9.0", path = "../supercli-client" }
# Optional: `supercli device …` needs it; without the `device` feature the
# verb prints "rebuild with --features device" (exit 2).
supercli-device = { version = "0.9.0", path = "../supercli-device", optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
semver = "1"

[features]
# Device control backends (adb/emulator, scrcpy, simctl, baguette).
device = ["supercli-device/device"]

[dev-dependencies]
tempfile = "3"
