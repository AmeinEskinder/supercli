[package]
name = "supercli-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The unpeel CLI: the UI-free Host service (`unpeel serve`) and scriptable verbs over Unpeel sessions"

[[bin]]
name = "supercli"
path = "src/main.rs"

[dependencies]
supercli-core = { version = "0.9.0", path = "../supercli-core" }
supercli-serve = { version = "0.9.0", path = "../supercli-serve" }
supercli-connector = { version = "0.9.0", path = "../supercli-connector" }
supercli-client = { version = "0.9.0", path = "../supercli-client" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
semver = "1"

[dev-dependencies]
tempfile = "3"
