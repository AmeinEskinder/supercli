[package]
name = "unpeel-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Connector (plugin) runtime for the Unpeel harness host: manifest loading, discovery, approval policy, and MCP process management"

[dependencies]
unpeel-client = { path = "../unpeel-client" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse"] }
thiserror = "2"
semver = "1"
ureq = "3.4.2"
flate2 = "1.1.10"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
tar = "0.4.46"
sha2 = "0.11.0"
getrandom = "0.4.3"

[dev-dependencies]
serde_json = "1"
