[package]
name = "supercli-device"
# Workspace keys (integrated into crates/Cargo.toml members).
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LITE Android/iOS emulator control for supercli: shells out to adb/emulator and xcrun simctl; no bundled emulators, no heavy deps"

[features]
# Real backends (adb.rs, baguette.rs, scrcpy.rs, simctl.rs) compile only
# with this feature. Without it the crate is just the trait + error types
# plus the always-compiled wire_format and setup modules (a few KB).
device = []
