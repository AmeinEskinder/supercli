[package]
name = "supercli-core"
description = "Supercli session backend: hosted PTY sessions, provider integrations, hook assets, MCP host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Preserve the shipped Host/backend build for every existing consumer. Web
# Controllers opt into only the transport-neutral semantic and wire layers.
default = ["native-host"]
# Allocator integration (Round 4, Lane 2): route release_memory_to_os through
# mimalloc's collect when supercli-host is built with --features mimalloc.
mimalloc = ["dep:libmimalloc-sys"]
controller-core = [
    "dep:base64",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:uuid",
    "dep:supercli-client",
]
native-host = [
    "controller-core",
    "dep:dirs",
    "dep:libc",
    "dep:log",
    "dep:md5",
    "dep:portable-pty",
    "dep:anyhow",
    "dep:rcgen",
    "dep:ring",
    "dep:rustls",
    "dep:sha1",
    "dep:sha2",
    "dep:semver",
    "dep:toml",
    "dep:webpki-roots",
    "dep:supercli-connector",
    "dep:rusqlite",
    "dep:tar",
]

[dependencies]
# Shared pure-logic home (git::head_branch, hash::fnv1a): core → client is
# acyclic (core → connector → client already exists transitively); the
# reverse would cycle, so the single implementations live in the client.
supercli-client = { version = "0.9.0", path = "../supercli-client", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }
portable-pty = { version = "0.8", optional = true }
anyhow = { version = "1", optional = true }
libc = { version = "0.2", optional = true }
libmimalloc-sys = { version = "0.1", optional = true, features = ["extended"] }
base64 = { version = "0.22", optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "6", optional = true }
uuid = { version = "1", features = ["v4", "js"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rcgen = { version = "0.13", optional = true }
sha1 = { version = "0.10", optional = true }
ring = { version = "0.17", optional = true }
webpki-roots = { version = "0.26", optional = true }
sha2 = { version = "0.10", optional = true }
md5 = { version = "0.7", optional = true }
semver = { version = "1", optional = true }
supercli-connector = { version = "0.9.0", path = "../supercli-connector", optional = true }
rusqlite = { version = "0.37", optional = true, features = ["bundled", "backup"] }
tar = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
# Pin test for the bundled license public key: validates it is a real
# Ed25519 point (test-only use; production verification goes through ring).
ed25519-dalek = "3"
# rusqlite for integration tests that read runs.db directly (replaces the
# sqlite3 CLI, which is an undeclared external dependency).
# Gated to non-wasm32: check-portable-core.sh runs clippy with
# --target wasm32-unknown-unknown --all-targets, and the bundled SQLite C
# build cannot compile for wasm32 (no stdio.h).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }

[[example]]
name = "ssh_host_probe"
required-features = ["native-host"]

[[example]]
name = "durable_chaos_helper"
required-features = ["native-host"]

[[example]]
name = "s2_bench"
required-features = ["native-host"]

[[example]]
name = "s4_chaos_worker"
required-features = ["native-host"]

[[example]]
name = "s4_verify"
required-features = ["native-host"]

[[example]]
name = "s5_fuzz"
required-features = ["native-host"]

[[example]]
name = "scheduled_kill_helper"
required-features = ["native-host"]

[[example]]
name = "subagent_kill_helper"
required-features = ["native-host"]

[[test]]
name = "durable_chaos"
required-features = ["native-host"]

[[test]]
name = "fuzz_review_log"
required-features = ["native-host"]

[[test]]
name = "scheduled_kill"
required-features = ["native-host"]

[[test]]
name = "subagent_kill"
required-features = ["native-host"]

# Relay-conformance KAT as a dedicated target: the lib test binary also
# contains ghostty_vt::tests::layout_matches_type_json, which forces the
# macOS linker to extract the vendored libghostty-vt.a zig object (fragile;
# see vendor/ghostty-vt/fix-mh-execute-header.py). This target builds the KAT
# through `cargo test` without that link.
[[test]]
name = "relay_kat"
required-features = ["native-host"]

[[bin]]
name = "durable_chaos_helper"
path = "src/bin/durable_chaos_helper.rs"
required-features = ["native-host"]

[[bin]]
name = "scheduled_kill_helper"
path = "src/bin/scheduled_kill_helper.rs"
required-features = ["native-host"]

[[bin]]
name = "subagent_kill_helper"
path = "src/bin/subagent_kill_helper.rs"
required-features = ["native-host"]
