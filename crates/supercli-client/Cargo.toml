[package]
name = "supercli-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust client for the Supercli Host protocol — the portable foundation the Dioxus cross-platform clients are built on"

[dependencies]
# Web-safe subset: the only deps the wasm32 web target compiles.
# Everything else lives under [target.'cfg(not(target_arch = "wasm32"))']
# because it needs OS sockets, threads, or the platform keychain.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Shared pure logic (git::head_branch, hash::fnv1a): tiny leaf crate, std
# only — keeps the wasm32 web-safe subset dependency-free of the Host.
supercli-shared = { version = "0.9.0", path = "../supercli-shared" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["json"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
percent-encoding = "2"
# Relay E2E transport (Track B): X25519 handshake + WebSocket client.
x25519-dalek = { version = "2", features = ["getrandom"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
getrandom = "0.2"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service"] }

[dev-dependencies]
rcgen = "0.13"
serde_json = "1"
tungstenite = "0.26"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Peer-file compatibility test (tests/peer_file_compat.rs): the client's
# save_peer output must be readable by supercli-core's read_peer_file.
# Scoped to non-wasm32 so the portable web build never sees the native Host.
supercli-core = { version = "0.9.0", path = "../supercli-core" }

[target.'cfg(target_os = "linux")'.dependencies]
# Feature unification for keyring's async Secret Service backend: keyring
# enables the `secret-service` crate but not its runtime feature, so we
# select the pure-Rust async-io runtime here (no libdbus system dep).
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Exclusive file locking on Windows via LockFileEx (link-license.lock).
fs2 = "0.4"

[features]
# test-util exposes test-only helpers (e.g. MemoryHostCredentialStore) to
# downstream crates' integration tests. Production code must never enable it.
test-util = []

# remote_runtime_live imports the test-only MemoryHostCredentialStore to prove
# the production constructor uses the OS keychain instead. cfg(test) is NOT
# set on the lib when building integration tests, so the feature must be
# declared required here; run with `cargo test -p supercli-client --features test-util`.
[[test]]
name = "remote_runtime_live"
required-features = ["test-util"]
