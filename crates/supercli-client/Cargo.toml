[package]
name = "unpeel-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust client for the Unpeel Host protocol — the portable foundation the Dioxus cross-platform clients are built on"

[dependencies]
# Web-safe subset: the only deps the wasm32 web target compiles.
# Everything else lives under [target.'cfg(not(target_arch = "wasm32"))']
# because it needs OS sockets, threads, or the platform keychain.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["json"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
percent-encoding = "2"
# Relay E2E transport (Track B): X25519 handshake + WebSocket client.
x25519-dalek = { version = "2", features = ["getrandom"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
getrandom = "0.2"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = "3"

[dev-dependencies]
rcgen = "0.13"
serde_json = "1"
tungstenite = "0.26"
