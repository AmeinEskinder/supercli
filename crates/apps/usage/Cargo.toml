[package]
name = "supercli-usage"
version = "0.1.1"
edition = "2021"
description = "Local AI usage & credits at a glance — a standalone terminal dashboard that lights up as an Supercli App"
license = "MIT"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
toml = "0.8"
supercli-app-kit = { path = "../../../clients/legacy/app-kit" }
ureq = "3"
