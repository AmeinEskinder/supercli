[package]
name = "supercli-filetree"
version = "0.1.1"
edition = "2024"
description = "Development file explorer TUI for testing path drag-and-drop in Supercli"
license = "MIT"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1"
supercli-app-kit = { path = "../app-kit" }

[dev-dependencies]
tempfile = "3"
