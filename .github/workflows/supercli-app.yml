# supercli-app CI: Dart analyze + tests + headless smoke.
#
# This workflow exists because the approval-gate merge broke
# clients/supercli-app/test/host_git_test.dart and nothing caught it:
# no workflow was running the supercli-app Dart tests.
#
# REQUIRED CHECK: This workflow must stay green before any merge into `next`.
# Configure it as a required status check on the `next` branch (and `main`).
# Do not merge into `next` while this workflow is red.
#
# Triggers: push to next, main, feat/** — and all pull requests.

name: supercli-app (Dart)

on:
  push:
    branches:
      - next
      - main
      - 'feat/**'
    paths:
      - 'clients/supercli-app/**'
      - 'clients/gpuidart/**'
      - 'crates/supercli-host/**'
      - 'crates/supercli-cli/**'
      - '.github/workflows/supercli-app.yml'
  pull_request:
    paths:
      - 'clients/supercli-app/**'
      - 'clients/gpuidart/**'
      - 'crates/supercli-host/**'
      - 'crates/supercli-cli/**'
      - '.github/workflows/supercli-app.yml'

jobs:
  dart:
    name: analyze + test + headless smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules, read-only)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Read-only: no credentials persisted; the gpuidart submodule is
          # only read, never modified (see repo rule: never modify
          # clients/gpuidart/).
          persist-credentials: false

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Dart version
        run: dart --version

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Build supercli-client-ffi cdylib (for FFI tests)
        run: |
          set -euo pipefail
          cd crates
          # Pinned toolchain; the Dart tests load this library via
          # SUPERCLI_FFI_LIB and check its ABI version at load time.
          cargo build -q --locked -p supercli-client-ffi --release
          lib="$(pwd)/target/release/libsupercli_client_ffi.so"
          test -f "$lib"
          echo "SUPERCLI_FFI_LIB=$lib" >> "$GITHUB_ENV"
          echo "Built $lib"

      - name: dart pub get
        working-directory: clients/supercli-app
        run: dart pub get

      - name: dart analyze --fatal-infos
        working-directory: clients/supercli-app
        run: dart analyze --fatal-infos

      - name: dart test
        working-directory: clients/supercli-app
        run: dart test
        env:
          SUPERCLI_FFI_LIB: ${{ env.SUPERCLI_FFI_LIB }}

      - name: No hardcoded key chords outside lib/keymap.dart
        working-directory: clients/supercli-app
        run: |
          # Guard test (also runs under `dart test`, surfaced here explicitly).
          dart test test/no_hardcoded_keys_test.dart
          # Belt and braces: grep for quoted ctrl/cmd/meta chords or
          # interpolated keys:/shortcut: strings outside lib/keymap.dart.
          hits=$(grep -rnE "['\"](ctrl|cmd|meta)\+" lib bin --include='*.dart' | grep -v 'lib/keymap.dart' || true)
          hits2=$(grep -rnE "(keys|shortcut):[[:space:]]*['\"]\\$" lib bin --include='*.dart' | grep -v 'lib/keymap.dart' || true)
          if [ -n "$hits" ] || [ -n "$hits2" ]; then
            echo "FAIL: hardcoded key chords outside lib/keymap.dart:"
            echo "$hits"
            echo "$hits2"
            exit 1
          fi
          echo "PASS: no hardcoded key chords outside lib/keymap.dart."

      - name: Build supercli (for headless smoke)
        run: |
          set -euo pipefail
          cd crates
          cargo build -q --locked -p supercli-cli
          echo "SUPERCLI_BIN=$PWD/target/debug/supercli" >> "$GITHUB_ENV"

      - name: Headless smoke (app --headless vs local serve)
        run: |
          set -euo pipefail
          # Fresh isolated home so the smoke never touches a real ~/.supercli.
          export SUPERCLI_HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$SUPERCLI_HOME"
          # Start the real Host in the background.
          "$SUPERCLI_BIN" serve >"$RUNNER_TEMP/serve.log" 2>&1 &
          SERVE_PID=$!
          # Wait for the Host to write serve.json (ready signal).
          READY=0
          for _ in $(seq 1 40); do
            if [ -f "$SUPERCLI_HOME/serve.json" ]; then
              READY=1; break
            fi
            sleep 0.5
          done
          if [ "$READY" != 1 ]; then
            echo "serve did not become ready; log:"
            cat "$RUNNER_TEMP/serve.log" || true
            kill "$SERVE_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Host is up (serve.json present)."
          # The Host only starts its /mobile direct (TLS) listener while a
          # pairing window is open or a Controller is paired. Open a pairing
          # window through the local gateway (framed unix-socket protocol on
          # host.sock) so the listener binds; cancel it after the smoke.
          cat > "$RUNNER_TEMP/pairing_ctl.py" <<'PYEOF'
          import socket, struct, json, base64, sys
          def gateway_call(home, action):
              body = json.dumps({"action": action}).encode()
              req = {
                  "id": 1,
                  "method": "POST",
                  "path": "/_supercli/pairing",
                  "query": {},
                  "auth": None,
                  "contentType": "application/json",
                  "bodyB64": base64.b64encode(body).decode(),
              }
              payload = json.dumps(req).encode()
              frame = (b"UPL1" + bytes([1, 0, 0, 0])
                       + struct.pack(">I", len(payload)) + payload)
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(15)
              s.connect(home + "/host.sock")
              s.sendall(frame)
              def read_n(n):
                  buf = b""
                  while len(buf) < n:
                      chunk = s.recv(n - len(buf))
                      if not chunk:
                          raise RuntimeError("host closed the socket")
                      buf += chunk
                  return buf
              hdr = read_n(12)
              if hdr[:4] != b"UPL1" or hdr[4] != 2:
                  raise RuntimeError("bad response frame from host")
              ln = struct.unpack(">I", hdr[8:12])[0]
              resp = json.loads(read_n(ln))
              if resp.get("status") != 200:
                  raise RuntimeError("host rejected pairing action: %r" % (resp,))
              b64 = resp.get("bodyB64")
              return json.loads(base64.b64decode(b64)) if b64 else {}
          print(json.dumps(gateway_call(sys.argv[1], sys.argv[2])))
          PYEOF
          python3 "$RUNNER_TEMP/pairing_ctl.py" "$SUPERCLI_HOME" begin > /dev/null
          echo "Pairing window opened (direct listener starting)."
          # The Host binds its /mobile direct listener to an ephemeral port;
          # serve.json carries it as directPort (camelCase). Poll until the
          # listener is up.
          DIRECT_PORT=""
          for _ in $(seq 1 40); do
            DIRECT_PORT=$(python3 -c "import json; print(json.load(open('$SUPERCLI_HOME/serve.json')).get('directPort') or '')")
            if [ -n "$DIRECT_PORT" ]; then break; fi
            sleep 0.5
          done
          if [ -z "$DIRECT_PORT" ]; then
            echo "FAIL: serve.json has no directPort; Host /mobile listener not running"
            cat "$SUPERCLI_HOME/serve.json"
            cat "$RUNNER_TEMP/serve.log" || true
            python3 "$RUNNER_TEMP/pairing_ctl.py" "$SUPERCLI_HOME" cancel > /dev/null 2>&1 || true
            kill "$SERVE_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Host directPort=$DIRECT_PORT"
          # Run the Dart app headless against the local Host. The direct
          # listener is TLS with a self-signed Host certificate, so pass
          # --tls --insecure (e2e only). Without a paired token the bootstrap
          # is expected to fail with a Host error; the smoke asserts the app
          # starts, attempts the real bootstrap, handles the error gracefully,
          # and exits 0.
          cd clients/supercli-app
          dart run bin/main.dart --headless --host=127.0.0.1 --port="$DIRECT_PORT" --tls --insecure \
            >"$RUNNER_TEMP/smoke.log" 2>&1
          SMOKE_EXIT=$?
          echo "--- smoke.log (stdout+stderr) ---"
          cat "$RUNNER_TEMP/smoke.log"
          echo "--- end smoke.log (exit=$SMOKE_EXIT) ---"
          python3 "$RUNNER_TEMP/pairing_ctl.py" "$SUPERCLI_HOME" cancel > /dev/null 2>&1 || true
          kill "$SERVE_PID" 2>/dev/null || true
          if [ "$SMOKE_EXIT" != 0 ]; then
            echo "FAIL: headless app exited $SMOKE_EXIT (see smoke.log above for the Dart exception)"
            exit 1
          fi
          grep -q "headless: sessions=" "$RUNNER_TEMP/smoke.log" || {
            echo "FAIL: expected 'headless: sessions=' in smoke output"
            exit 1
          }
          echo "PASS: headless smoke completed."
