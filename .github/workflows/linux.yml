# Linux full-stack CI for the active Rust workspace (crates/).
# 2026-09-26: the Dioxus launchers are frozen under clients/legacy/dioxus/
# and no longer built here; the dioxus-launchers job was removed.
name: Linux full

on:
  workflow_dispatch:
  push:
    branches: ['track-b*', main]
    paths:
      - 'crates/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/linux.yml'

permissions:
  contents: read

concurrency:
  group: linux-full-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10

jobs:
  rust-workspace:
    name: Rust workspace (fmt, clippy, tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Rust MSRV
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
      - name: Check formatting
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check
      - name: Clippy (strict)
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --all-targets --all-features --locked

  # dioxus-launchers: REMOVED 2026-09-26. The Dioxus tree is frozen under
  # clients/legacy/dioxus/ per Amein; this job referenced clients/dioxus/
  # which no longer exists.

  release-size-budget:
    name: Release size budget (R3)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK/WebKit system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.0-dev \
            libayatana-appindicator3-dev
      - name: Install declared Rust MSRV
        uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
      - name: Release build (Host)
        # 2026-09-26: Dioxus launchers are frozen under clients/legacy/dioxus/;
        # size budgets now cover only the active crates/ binaries.
        run: |
          cargo build --release --manifest-path crates/Cargo.toml --locked -p supercli-host
      - name: Check size budgets
        run: |
          # R3: release binaries must stay under budget.
          # Budgets (bytes), measured 2026-09-25 on the release profile
          # (thin LTO, 16 codegen units, strip, panic=unwind) + ~35% headroom:
          # - supercli-host: measured 16,244,120 -> 21 MiB budget
          # Debug (before) for reference: supercli 188,061,600 / supercli-host 185,019,384.
          # (Dioxus desktop/mobile budgets removed 2026-09-26; tree is frozen.)
          check_size() {
            local bin="$1"
            local budget="$2"
            local size=$(stat -c%s "$bin")
            local mb=$(awk "BEGIN {printf \"%.1f\", $size/1048576}")
            echo "$bin: ${mb}MB (budget: $(awk "BEGIN {printf \"%.0f\", $budget/1048576}")MB)"
            if [ "$size" -gt "$budget" ]; then
              echo "ERROR: $bin exceeds size budget"
              exit 1
            fi
          }
          check_size "crates/target/release/supercli-host" 22020096
          echo "All release binaries within budget."

  # web: REMOVED 2026-09-26. Tested the frozen Dioxus web UI under
  # clients/dioxus/ (now clients/legacy/dioxus/). The gpuidart web target
  # will get its own workflow when ready.

  rename-guard:
    name: Rename guard (no 'supercli' remnants)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail on any remaining 'supercli' references
        run: |
          # The rename supercli -> supercli must be complete. Allowlist:
          # - THIRD_PARTY_NOTICES.txt (generated third-party licenses)
          # - docs/internal/ (historical records)
          # - *.lock (cargo lockfiles may reference old names transiently)
          if grep -ri 'supercli' \
            --exclude-dir=target \
            --exclude-dir=.git \
            --exclude-dir=docs/internal \
            --exclude-dir=clients/gpuidart \
            --exclude=THIRD_PARTY_NOTICES.txt \
            --exclude='*.lock' \
            . ; then
            echo "ERROR: found 'supercli' references outside the allowlist"
            exit 1
          fi
          echo "Rename guard passed: no 'supercli' remnants."
