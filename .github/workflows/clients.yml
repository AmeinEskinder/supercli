# The Apple clients are FROZEN under clients/legacy/ per Amein 2026-09-26.
# DISABLED 2026-09-26: push/PR triggers removed. Manual dispatch only via the
# Actions tab. The gpuidart app (clients/supercli-app/) will get its own
# workflow when ready.
name: Apple clients (legacy, frozen, DISABLED)

on:
  workflow_dispatch:
  # push: DISABLED — legacy clients are frozen, no CI triggers.
  # pull_request: DISABLED — legacy clients are frozen, no CI triggers.

permissions:
  contents: read

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-clients:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Show the image's default Xcode
        # The app needs the macOS 26 SDK (Liquid Glass styles) and Swift 6.2.
        # Every Xcode 26.x on the macos-15 image crashes ibtoold/actool with
        # missing-symbol dyld errors (a macOS 26 toolchain on a macOS 15 host),
        # so the job runs on the macOS 26 image with its default Xcode.
        run: |
          ls -d /Applications/Xcode_*.app | sort -V
          xcodebuild -version
      - name: Install declared Rust MSRV
        uses: dtolnay/rust-toolchain@1.88.0
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            crates/supercli-attach
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            clients/native/SupercliNative/.build
            clients/shared/SupercliShared/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('clients/**/Package.resolved', 'clients/native/vendor/libghostty-spm/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-
      - name: Runtime catalog copies agree
        run: bun run check:runtimes
      - name: SupercliShared tests
        run: swift test --package-path clients/shared/SupercliShared
      - name: Unsigned Mac app (server + bridge built from this tree)
        env:
          CODESIGN_IDENTITY: '-'
          SUPERCLI_DEV_BUILD: '0'
          SUPERCLI_BUILD: ${{ github.run_number }}
        run: clients/native/build-app.sh
      - name: iOS package tests (simulator)
        # Pick whatever iPhone simulator the image ships (device names change
        # with every iOS runtime; the image had no "iPhone 16 Pro" under iOS 26).
        env:
          SUPERCLI_IOS_TEST_DERIVED_DATA: ${{ runner.temp }}/supercli-ios-tests
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=sorted([x for rt,xs in d.items() if "iOS" in rt for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")], key=lambda x: x["name"]); print(c[-1]["udid"] if c else "")')"
          test -n "$UDID" || { echo "no available iPhone simulator on this image"; xcrun simctl list devices available; exit 1; }
          xcrun simctl boot "$UDID" || true
          export SUPERCLI_IOS_TEST_DESTINATION="platform=iOS Simulator,id=$UDID"
          echo "destination: $SUPERCLI_IOS_TEST_DESTINATION"
          clients/ios/test-ios.sh
