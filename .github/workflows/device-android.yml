# Headless Android emulator proof for the native scrcpy client.
#
# Runs on every push to track-b-device (and manual dispatch). Boots a real
# emulator with KVM (no window, no audio), then drives it through
# crates/supercli-device/src/scrcpy_native.rs:
#   - connects (jar deploy + SHA-256, port forward, server start)
#   - reads >= 600 real H.264 packets, measures fps over 60 s
#   - tap-to-frame p50/p95: native control channel vs `adb shell input`
#   - two-pointer pinch
# Uploads: screenshot.png, test-10s.mkv, metrics.json.
#
# Choice of runner action: ReactiveCircus/android-emulator-runner@v2 is the
# de-facto standard (used by google/iosched etc.); it handles SDK install,
# AVD creation, KVM accel detection and boot-wait reliably. A hand-rolled
# sdkmanager flow would duplicate all of that.
#
# GOTCHA (run #1, exit 127): the action executes each LINE of its `script:`
# input as a separate `sh -c '<line>'` (see parseScript in the action source).
# Backslash continuations, `export`, and `cd` do not survive across lines, so
# the e2e logic lives in android-e2e.sh, invoked here via a single line.

name: device-android

on:
  push:
    branches: [track-b-device]
  workflow_dispatch:

env:
  RUST_VERSION: "1.88.0"

jobs:
  android-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "NO /dev/kvm (emulator will fall back to software accel)"

      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Headless emulator + native scrcpy e2e
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back webcam0
          # Single line: the action runs each script: line as its own sh -c,
          # so the multi-line e2e logic lives in android-e2e.sh.
          script: bash "$GITHUB_WORKSPACE/.github/workflows/android-e2e.sh"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            e2e.log
            e2e-logcat.txt
            e2e-server-ps.txt
            screenshot.png
            test-10s.mkv
            metrics.json
          # e2e.log / logcat exist even when the test fails; the media
          # files only exist on success.
          if-no-files-found: warn
