# Android APK assembly for the Unpeel Dioxus mobile launcher.
#
# The Rust code cross-compiles to Android (libmain.so) via `dx bundle`.
# This workflow assembles the signed APK on an Ubuntu runner where the
# Gradle daemon IPC works (it is broken in sandboxed environments).
#
# Local status (2026-09-22): APK assembly blocked in this sandbox.
# `gradle --no-daemon -Dorg.gradle.daemon=false assembleDebug` fails with:
#   "Could not receive a message from the daemon."
# The --no-daemon flag still forks a single-use daemon for JVM settings,
# and the daemon IPC channel is broken in this sandbox. Needs a real
# machine/CI (this workflow).

name: Android APK (Dioxus)

on:
  workflow_dispatch:
  push:
    branches: ['track-b*', main]
    paths:
      - 'clients/dioxus/**'
      - 'crates/unpeel-client/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'clients/dioxus/**'
      - 'crates/unpeel-client/**'

env:
  RUST_VERSION: "1.88.0"
  DIOXUS_CLI_VERSION: "0.7.10"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/dioxus

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version ${{ env.DIOXUS_CLI_VERSION }} --locked

      - name: Cross-compile Rust (validates libmain.so)
        working-directory: clients/dioxus
        run: dx bundle --platform android --package unpeel-mobile

      - name: Assemble APK (no daemon, isolated Gradle home)
        working-directory: clients/dioxus
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-isolated
        run: |
          APP_DIR="$(find target/dx -type d -name 'app' -path '*android*' | head -1)"
          test -n "$APP_DIR" || { echo "no android app dir under target/dx"; exit 1; }
          cd "$APP_DIR"
          gradle --no-daemon -Dorg.gradle.daemon=false assembleDebug

      - name: Verify APK (apksigner + aapt)
        working-directory: clients/dioxus
        run: |
          APK="$(find target/dx -name '*.apk' | head -1)"
          test -n "$APK" || { echo "no APK found"; exit 1; }
          echo "APK: $APK"
          apksigner verify --print-certs "$APK" | head -10
          aapt dump badging "$APK" | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unpeel-mobile-debug-apk
          path: clients/dioxus/target/dx/**/*.apk
          if-no-files-found: error
