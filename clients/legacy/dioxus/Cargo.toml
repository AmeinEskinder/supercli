[workspace]
resolver = "2"
members = [
    "supercli-ui",
    "supercli-desktop",
    "supercli-mobile",
    "supercli-web",
    "supercli-ios-bridge",
]

# Separate workspace from crates/ on purpose (same reason as crates/apps):
# the Dioxus dependency tree must never slow the Host's gates.

# Shared dependency versions, inherited by every member crate via
# `dep = { workspace = true, ... }`. One place to bump; per-crate
# feature selection still happens at the use site.
[workspace.dependencies]
dioxus = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16.2"
supercli-client = { path = "../../crates/supercli-client" }
supercli-ui = { path = "supercli-ui" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"
