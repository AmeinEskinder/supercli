[package]
name = "supercli-mobile"
version = "0.8.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
description = "Supercli mobile client (Dioxus) — session list + live terminal over the Host protocol"

[[bin]]
name = "supercli-mobile"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["mobile", "launch"] }
supercli-ui = { workspace = true }
supercli-client = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

# Native rendering path (Blitz) is evaluated behind this feature.
# The default mobile renderer today is the OS webview; see README.md.
[features]
default = []
native-ui = []
