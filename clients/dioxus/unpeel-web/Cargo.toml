[package]
name = "unpeel-web"
version = "0.7.1"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
description = "Dioxus web target for the Unpeel clients: the shared unpeel-ui component library rendered in a browser against in-memory demo state"

[[bin]]
name = "unpeel-web"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["web", "launch", "devtools"] }
unpeel-ui = { workspace = true }
unpeel-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
