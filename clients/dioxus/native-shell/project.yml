# XcodeGen project for the Supercli Dioxus iOS native shell.
#
# This generates the Xcode project that hosts the Dioxus mobile launcher's
# WKWebView plus the native bridges (push, speech, reflection). The Rust
# side is complete; this project is the Mac-only shell that provides:
# - APNs token acquisition (PushAppDelegate — cannot be done from Rust)
# - SFSpeechRecognizer / SpeechAnalyzer dictation drivers
# - FoundationModels reflection
#
# Usage (on a Mac with Xcode):
#   cd clients/dioxus/native-shell
#   xcodegen generate
#   open SupercliShell.xcodeproj
#
# The generated project is Mac-only: it requires the iOS SDK, code signing,
# and Apple frameworks (UserNotifications, Speech, FoundationModels).
# CI builds it on macos-15+ runners (see .github/workflows/apple.yml).

name: SupercliShell
options:
  bundleIdPrefix: com.supercli
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    PRODUCT_NAME: Supercli
    MARKETING_VERSION: "0.7.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # Set your Team ID here or in Xcode
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

targets:
  SupercliShell:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SupercliPushBridge.swift
      - path: SupercliSpeechBridge.swift
      - path: SupercliReflectBridge.swift
      # The shell's app/scene lifecycle and WKWebView host are created in
      # Xcode (File → New → Target → iOS App). Add your App.swift / SceneDelegate
      # here, or generate them via the Xcode template and add to sources.
    info:
      path: InfoPlistAdditions.plist
      properties:
        CFBundleDisplayName: Supercli
        CFBundleIdentifier: com.supercli.controller
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Supercli.entitlements
    capabilities:
      - push: true
    settings:
      base:
        INFOPLIST_FILE: SupercliShell/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupercliShell/Supercli.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

schemes:
  SupercliShell:
    build:
      targets:
        SupercliShell: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
