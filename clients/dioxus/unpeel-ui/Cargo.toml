[package]
name = "supercli-ui"
version = "0.8.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
description = "Shared Dioxus components for the Supercli cross-platform clients (desktop + mobile)"

[features]
# Enabled by the iOS shell build: links the native shell's biometric
# authenticator (LocalAuthentication) through the two C symbols documented
# in src/app_lock.rs. Without it the backend reports unavailable and the
# Security toggle stays disabled.
shell-biometric = []

[dependencies]
dioxus = { workspace = true, features = ["lib", "document"] }
supercli-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vt100 = { workspace = true }
base64 = "0.22"
