schema_version = 1
id = "com.google.antigravity-cli"
slug = "antigravity"
legacy_slug = "agy"
label = "Antigravity"
adapter = "builtin:agy"
legacy_order = 14
platforms = ["macos", "linux"]
supports_quick_launch = true
capabilities = ["resume", "restart_agent", "mcp_sessions", "mcp_browser"]

# No vendor icon asset yet: the generic agent mark, like GitHub Copilot.
[display]
tint = "#4285F4"
spinner_tint = "#4285F4"
icon = "agent"
window_padding_x = 8

[install]
official_url = "https://antigravity.google/product/antigravity-cli"
command = "curl -fsSL https://antigravity.google/cli/install.sh | bash"

# No `[updates]`: `agy update` is self-updating and there is no public
# latest-version endpoint to compare against, so Settings offers no Update.

# Google's `agy` (Antigravity CLI, the Gemini CLI successor): one Go binary
# in ~/.local/bin. Community request: orgs/supercli-com discussions #13.
[detection]
command_aliases = ["agy"]
process_aliases = ["agy"]
script_path_signatures = []

# No documented lifecycle hook or notify mechanism (antigravity.google/docs/cli
# reference, 2026-09-17): output is telemetry only, never Busy authority.
[lifecycle]
source = "output"
authority = "none"
fallback = "none"
completion_reliable = false
attention_reliable = false

[[suggested_presets]]
id = "agy"
label = "agy --dangerously-skip-permissions"
command = "agy --dangerously-skip-permissions"
quick_launch = false

[integration]
summary = "Adds the supercli MCP server to Antigravity's global MCP config, ~/.gemini/config/mcp_config.json."
