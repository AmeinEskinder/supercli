schema_version = 1
id = "com.google.gemini-cli"
slug = "gemini"
legacy_slug = "gemini"
label = "Gemini"
adapter = "builtin:gemini"
legacy_order = 4
platforms = ["macos", "linux"]
supports_quick_launch = true
capabilities = ["lifecycle_hooks", "resume", "restart_agent", "transcript", "notify_when_done"]

[display]
tint = "#6EA8FF"
spinner_tint = "#6EA8FF"
icon = "gemini"
icon_asset = "assets/icon.svg"
icon_source = "internal:legacy-unpeel-tool-icons"
icon_license = "vendor-brand-asset"
window_padding_x = 8

[install]
official_url = "https://github.com/google-gemini/gemini-cli"
command = "npm install -g @google/gemini-cli"

[updates]
version_args = ["--version"]
latest_url = "https://registry.npmjs.org/@google/gemini-cli/latest"
json_pointer = "/version"

[detection]
command_aliases = ["gemini"]
process_aliases = ["gemini"]
script_path_signatures = []

[lifecycle]
source = "hooks"
authority = "complete"
fallback = "screen"
completion_reliable = true
attention_reliable = true
escape_cancels_turn = true

# Screen fallback (no integration installed): Gemini shows "(esc to cancel"
# beside its spinner; its idle input box carries the placeholder text.
[screen]
working = ["esc to cancel"]
idle_prompt = ["Type your message", "> Type your message"]

[integration]
summary = "Registers Unpeel's lifecycle hooks in ~/.gemini/settings.json."
legacy_evidence = ["hooks/gemini-hook.sh"]

[[usage.stores]]
root = ".gemini/tmp"
extensions = ["json", "jsonl"]
parent_dir_name = "chats"

[[suggested_presets]]
id = "gemini"
label = "gemini --yolo"
command = "gemini --yolo"
quick_launch = false
